<h2>THU Auto Login</h2>

<p>这个安装包会安装三样东西：</p>
<ul>
  <li><b>按键代理</b>（菜单栏 App）——持有"辅助功能"权限，向 Chrome 注入真实按键</li>
  <li><b>原生消息主机</b>——供 Chrome 扩展调用，本身不需要任何权限</li>
  <li><b>Chrome 扩展</b>——安装完成后由你手动载入</li>
</ul>

<p>安装包内已经包含<b>编译好的程序</b>，你不需要安装 Xcode、编译器或 Python。</p>

<p>安装过程会要求输入管理员密码，因为程序要放到 <code>/Applications</code> 和 <code>/Library</code>。</p>

<p>安装结束后还有<b>两步手动操作</b>，下一步会说明。</p>
</body>
